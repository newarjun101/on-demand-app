name: Deploy to Lightsail

# Every push to main builds all four apps, then redeploys the Docker Compose
# stack on the Lightsail instance over SSH. Can also be started by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, customer-web, worker-web, admin-web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        if: matrix.app == 'backend'
        run: npx prisma generate

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Lightsail
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          # Optional repository variable; defaults to 22.
          SSH_PORT: ${{ vars.LIGHTSAIL_SSH_PORT || '22' }}
        run: |
          for name in LIGHTSAIL_HOST LIGHTSAIL_USER LIGHTSAIL_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or missing (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

          # Accept "1.2.3.4", "ubuntu@1.2.3.4", "ssh://host", "http://host/" and stray spaces.
          host="$(printf '%s' "$LIGHTSAIL_HOST" | tr -d '[:space:]')"
          host="${host#*://}"; host="${host#*@}"; host="${host%%/*}"
          user="$(printf '%s' "$LIGHTSAIL_USER" | tr -d '[:space:]')"
          echo "::add-mask::$host"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$user" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$SSH_PORT" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" | tr -d '\r' > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          if ! ssh-keygen -y -f ~/.ssh/lightsail >/dev/null 2>&1; then
            echo "::error::LIGHTSAIL_SSH_KEY is not a valid private key. Paste the whole .pem file, including the BEGIN and END lines."
            exit 1
          fi

          echo "Checking TCP port $SSH_PORT on the server..."
          if ! timeout 15 bash -c "</dev/tcp/$host/$SSH_PORT" 2>/dev/null; then
            echo "::error::Cannot reach the server on port $SSH_PORT. In Lightsail > Networking > IPv4 firewall, allow SSH (TCP $SSH_PORT) from any IP, and check that LIGHTSAIL_HOST is the instance public IP."
            exit 1
          fi

          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$host" >> ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Port $SSH_PORT is open but no SSH host key was returned."
            exit 1
          fi

      - name: Deploy over SSH
        env:
          # Optional repository variable; defaults to ~/on-demand-app on the server.
          APP_DIR: ${{ vars.LIGHTSAIL_APP_DIR }}
        run: |
          # %q quotes the values safely for the remote shell.
          printf -v remote_cmd 'APP_DIR=%q DEPLOY_SHA=%q bash -s' "$APP_DIR" "$GITHUB_SHA"
          ssh -i ~/.ssh/lightsail -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_cmd" \
            < .github/scripts/deploy-lightsail.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/lightsail
