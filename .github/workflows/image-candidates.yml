name: Temporary image candidate fetch
on:
  push:
    branches: [image-candidates]
    paths: [tools/fetch_candidates.py, .github/workflows/image-candidates.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pillow
      - run: python tools/fetch_candidates.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add candidates
          git commit -m "temp: image candidates" && git push
